name: refresh official liquor prices

on:
  schedule:
    - cron: "0 0 * * *" # 05:30 IST every day; a successful check may leave prices unchanged.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: official-price-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PRICE_PYTHON: python3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check production connection secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL GitHub Actions secret is required before the scheduled price refresh can run."
            exit 1
          fi
      - run: npm ci
      - run: python -m pip install --disable-pip-version-check -r scripts/requirements-price-job.txt
      - name: Complete verified BEVCO certificate chain
        run: |
          curl --fail --silent --show-error --location --max-time 30 https://secure.globalsign.com/cacert/gsrsaovsslca2018.crt --output "$RUNNER_TEMP/bevco-issuer.der"
          openssl x509 -inform DER -in "$RUNNER_TEMP/bevco-issuer.der" -out "$RUNNER_TEMP/bevco-issuer.pem"
          openssl verify -CAfile /etc/ssl/certs/ca-certificates.crt "$RUNNER_TEMP/bevco-issuer.pem"
          cat /etc/ssl/certs/ca-certificates.crt "$RUNNER_TEMP/bevco-issuer.pem" > "$RUNNER_TEMP/price-source-ca.pem"
          echo "PRICE_CA_BUNDLE=$RUNNER_TEMP/price-source-ca.pem" >> "$GITHUB_ENV"
      - run: npm run db:generate
      - run: npm run prices:refresh
